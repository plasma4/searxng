services:
  searxng:
    # Pinned by digest. ui/simple/base.html is a copy of this exact image's
    # template; on a blind `:latest` pull the copy could go stale against a
    # changed backend (renamed asset, new context variable) and break the page.
    # To upgrade: run ui/upgrade.sh, which three-way merges ui/simple/base.html
    # against the new image's template and bumps this digest. See ui/README.md.
    image: searxng/searxng@sha256:76f9ec5b3832921c8734c06c34248c9538d94a6cae0cf5e579fa5b41c8479789
    container_name: searxng
    ports:
      - "127.0.0.1:9000:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      # Read-only: the app must never be able to rewrite its own templates.
      # Jinja templates execute in app context, so a writable template mount
      # would turn any file-write bug into code execution.
      - ./ui/simple/base.html:/usr/local/searxng/searx/templates/simple/base.html:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:9000/
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
      # Session/cookie signing key. Read from .env (never committed); compose
      # refuses to start if it is missing.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env -- see README.md}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  valkey-data:
